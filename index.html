<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description"
        content="Cassano Marketplace is an online marketplace for fashion, watches, perfumes, electronics, beauty, home products and more. Shop from Tanzania and enjoy worldwide delivery.">

    <meta name="keywords"
        content="Cassano Marketplace, online shopping Tanzania, marketplace Tanzania, shop online Dar es Salaam, watches Tanzania, perfumes Tanzania, electronics Tanzania, fashion Tanzania, worldwide delivery">

    <meta name="author" content="Cassano Marketplace">

    <meta name="robots" content="index, follow">

    <link rel="canonical"
        href="https://1cassano.github.io/cassano-marketplace/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title"
        content="Cassano Marketplace | Shop Online in Tanzania & Worldwide">
    <meta property="og:description"
        content="Shop fashion, watches, perfumes, electronics, beauty, home products and more on Cassano Marketplace. Worldwide delivery.">
    <meta property="og:url"
        content="https://1cassano.github.io/cassano-marketplace/">
    <meta property="og:site_name" content="Cassano Marketplace">
    <meta property="og:image"
        content="https://1cassano.github.io/cassano-marketplace/ONLY%20C.png">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title"
        content="Cassano Marketplace | Shop Online in Tanzania & Worldwide">
    <meta name="twitter:description"
        content="Shop fashion, watches, perfumes, electronics and more. Worldwide delivery.">
    <meta name="twitter:image"
        content="https://1cassano.github.io/cassano-marketplace/ONLY%20C.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050505;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .splash {
            text-align: center;
            animation: fadeIn 1.5s ease;
        }

        .splash img {
            width: 250px;
            max-width: 70vw;
            animation: logoPulse 2.5s ease-in-out infinite;
        }

        .loading {
            margin-top: 25px;
            color: #D4AF37;
            font-size: 13px;
            letter-spacing: 3px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }
    </style>
</head>

<body>

    <div class="splash">
        <img src="./ONLY C.png" alt="Cassano Marketplace Logo">
        <div class="loading">CASSANO MARKETPLACE</div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "marketplace.html";
        }, 3000);
    </script>

</body>
</html>
